<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chat agent</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #faf9f7; color: #1a1a1a; }
  #wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; margin: 0 0 4px; }
  #sub { font-size: 12px; color: #888; margin-bottom: 24px; }
  .msg { margin: 0 0 18px; white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
  .msg .who { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 4px; }
  .msg.user .who { color: #4a6fa5; }
  .msg.assistant .who { color: #3d8a5a; }
  .msg .when { font-size: 10px; color: #bbb; margin-left: 8px; text-transform: none; letter-spacing: 0; }
  #sources { font-size: 12px; color: #666; margin: -8px 0 18px; display: none; }
  #sources a { color: #4a6fa5; text-decoration: none; }
  #sources a:hover { text-decoration: underline; }
  #bar { position: fixed; bottom: 0; left: 0; right: 0; background: #faf9f7; border-top: 1px solid #e5e2dd; padding: 12px 16px; }
  #bar-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  #in { flex: 1; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid #d8d4cd; border-radius: 6px; background: #fff; }
  #in:focus { outline: none; border-color: #4a6fa5; }
  #go { font: inherit; font-size: 14px; padding: 10px 18px; border: none; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; }
  #go:disabled { opacity: .4; cursor: default; }
  .cursor { display: inline-block; width: 7px; height: 14px; background: #3d8a5a; animation: blink 1s steps(1) infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="wrap">
  <h1>chat agent</h1>
  <div id="sub">one tool: web search. it remembers what you asked, and when.</div>
  <div id="log"></div>
  <div id="sources"></div>
</div>
<div id="bar"><div id="bar-inner">
  <input id="in" placeholder="ask something..." autofocus autocomplete="off">
  <button id="go">send</button>
</div></div>
<script>
const log = document.getElementById('log');
const sourcesBox = document.getElementById('sources');
const input = document.getElementById('in');
const go = document.getElementById('go');

function fmtWhen(ts) {
  return new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function addMsg(role, text, ts) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = role === 'user' ? 'you' : 'agent';
  if (ts) {
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = fmtWhen(ts);
    who.appendChild(when);
  }
  const body = document.createElement('span');
  body.className = 'body';
  body.textContent = text;
  div.appendChild(who);
  div.appendChild(body);
  log.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return body;
}

function showSources(sources) {
  if (!sources || !sources.length) { sourcesBox.style.display = 'none'; return; }
  sourcesBox.style.display = 'block';
  sourcesBox.replaceChildren(document.createTextNode('sources: '));
  sources.forEach((s, i) => {
    try {
      const url = new URL(s.url);
      if (!['https:', 'http:'].includes(url.protocol)) return;
      const link = document.createElement('a');
      link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
      link.textContent = `[${i + 1}] ${s.title || s.url}`;
      sourcesBox.append(link, document.createTextNode(' '));
    } catch { /* ignore invalid source URLs */ }
  });
  window.scrollTo(0, document.body.scrollHeight);
}

async function loadHistory() {
  const res = await fetch('/api/history');
  const { messages } = await res.json();
  for (const m of messages) addMsg(m.role, m.content, m.ts);
}

async function send() {
  const message = input.value.trim();
  if (!message || go.disabled) return;
  input.value = '';
  go.disabled = true;
  addMsg('user', message, Date.now());
  const body = addMsg('assistant', '');
  body.appendChild(document.createTextNode(''));
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  body.appendChild(cursor);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let acc = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const evt of events) {
        const evLine = evt.split('\n').find((l) => l.startsWith('event: '));
        const dataLine = evt.split('\n').find((l) => l.startsWith('data: '));
        if (!dataLine) continue;
        const kind = evLine ? evLine.slice(7) : 'message';
        const data = JSON.parse(dataLine.slice(6));
        if (kind === 'token') { acc += data.token; body.firstChild.nodeValue = acc; body.appendChild(cursor); }
        if (kind === 'done') { body.textContent = data.answer; showSources(data.sources); }
        if (kind === 'error') { acc += '\n(error: ' + data.error + ')'; body.firstChild.nodeValue = acc; }
        window.scrollTo(0, document.body.scrollHeight);
      }
    }
  } catch (err) {
    body.textContent = '(network error: ' + err.message + ')';
  }
  cursor.remove();
  go.disabled = false;
  input.focus();
}

go.onclick = send;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
loadHistory();
</script>
</body>
</html>
